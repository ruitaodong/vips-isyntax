# On a new git tag, build the image for Ubuntu focal, jammy and noble and publish each to ghcr.io,
# tagged with the git tag's exact name:
#   ghcr.io/<owner>/vips-isyntax-focal:<tag>
#   ghcr.io/<owner>/vips-isyntax-jammy:<tag>
#   ghcr.io/<owner>/vips-isyntax-noble:<tag>
name: build-images
on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (manual runs)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04      # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026
    env:
      BUILDKIT_PROGRESS: plain   # full output of every RUN step in the job log
    strategy:
      fail-fast: false          # one release failing doesn't cancel the others
      matrix:
        ubuntu: [focal, jammy, noble]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # image name per release; tag = the git tag name exactly (or the manual input)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vips-isyntax-${{ matrix.ubuntu }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=vips-isyntax-${{ matrix.ubuntu }}
            org.opencontainers.image.description=libvips with the vips-isyntax plugin (Philips iSyntax) on Ubuntu ${{ matrix.ubuntu }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: UBUNTU=${{ matrix.ubuntu }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.ubuntu }}
          cache-to: type=gha,scope=${{ matrix.ubuntu }},mode=max
